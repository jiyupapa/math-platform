<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수포자를 위한 스케일링 법칙과 평가의 통계</title>
    <script>
      // 저장된 테마를 번들보다 먼저 적용 — 없으면 다크 사용자가 첫 프레임에 흰 화면을 맞는다.
      // 키는 packages/ui/src/theme.ts 의 KEY 와 같아야 한다.
      try {
        var t = localStorage.getItem('series-theme-v1')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
