<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수포자를 위한 에이전트와 추론의 수학</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2288%22%3E%F0%9F%95%B9%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E" />
    <meta name="description" content="수포자를 위한 에이전트와 추론의 수학" />
    <script>
      // 저장된 테마를 번들보다 먼저 적용 — 없으면 다크 사용자가 첫 프레임에 흰 화면을 맞는다.
      // 키는 packages/ui/src/theme.ts 의 KEY 와 같아야 한다.
      try {
        var t = localStorage.getItem('series-theme-v1')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
